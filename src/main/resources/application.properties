spring.application.name=tenantflow
spring.datasource.url=jdbc:mysql://localhost:3306/tenantflow_central
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20


storage.driver=${STORAGE_DRIVER:local}
storage.local.root=uploads
storage.local.base-url=http://localhost:8080/uploads


tenant.prefix=tenant_
tenant.suffix=_sla