spring.application.name=tenantflow

spring.datasource.url=jdbc:mysql://localhost:3306/tenantflow_central
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.flyway.enabled=false

tenant.datasource.base-url=jdbc:mysql://localhost:3306/
storage.driver=${STORAGE_DRIVER:local}
storage.local.root=uploads
storage.local.base-url=http://localhost:8080/uploads

tenant.base-domain=${TENANT_BASE_DOMAIN:localhost}
tenant.prefix=tenant_
tenant.suffix=_sla